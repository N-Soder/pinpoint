version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # React and its type packages must move together: react-dom pins its react peer.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint accepts TypeScript below 6.1. Remove this once it supports TypeScript 7.
      - dependency-name: typescript
        versions: [">=6.1"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
